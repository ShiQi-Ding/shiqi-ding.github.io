name: Validate _data YAML

# Runs on every push or pull request that touches a file under `_data/`.
# A YAML syntax error here would break the GitHub Pages build with a confusing
# Psych::SyntaxError. This workflow surfaces a clearer error first.

on:
  push:
    paths:
      - '_data/**'
      - '.github/workflows/validate-yaml.yml'
  pull_request:
    paths:
      - '_data/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Parse every YAML file under _data/
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib
          errors = 0
          for p in sorted(pathlib.Path('_data').rglob('*.y*ml')):
              try:
                  yaml.safe_load(p.read_text())
                  print(f'  OK   {p}')
              except yaml.YAMLError as e:
                  print(f'  FAIL {p}')
                  print(f'       {e}')
                  errors += 1
          if errors:
              print(f'\n{errors} YAML file(s) failed to parse.')
              sys.exit(1)
          print('\nAll _data YAML files are valid.')
          PY
